<!-- La Caja 2 de Limay Rock 1 es el mismo sistema de la caja, abierto con ?caja=2
     (ese link es siempre la Caja 2, sin depender de lo elegido en el equipo).
     Esta carpeta tiene su propio manifiesto: al instalarla queda una app aparte
     ("Caja 2") que no pisa la de la Caja 1 ni la de admin.
     En limayrock.com.ar la raíz es el catálogo, por eso se va a la dirección de GitHub. -->
<script>
if(['limayrock24.github.io','localhost','127.0.0.1'].indexOf(location.hostname) === -1){
  location.replace('https://limayrock24.github.io/caja2/');
} else {
  document.write('<iframe src="../?caja=2" title="Caja 2" allow="clipboard-read; clipboard-write; fullscreen; camera"></iframe>');
}
</script>
</body></html>
