# Tarea de UN SOLO USO: mueve las etiquetas de las versiones de la app de
# delivery al historial limpio (sin el backup viejo). No cambia la página,
# ni la app, ni los archivos descargables. Se borra después de usarla.
name: Mover etiquetas al historial limpio (una vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover las 8 etiquetas
        run: |
          set -e
          while read nombre sha; do
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" origin/main
            git tag -f "$nombre" "$sha"
            git push -f origin "refs/tags/$nombre"
            echo "OK $nombre -> $sha"
          done <<'LISTA'
          app-delivery-v2 dfa24cc16b288614538fb0862ecdea840049ffe7
          app-delivery-v3 b19dbeffbfbfac5e24810bee89ae206c76fd5dff
          app-delivery-v4 6f3fa4637a84b1620addf82d48fa5a3b67d298ce
          app-delivery-v5 08380116abb1bc225b14da9da9d366dcaa54fd05
          app-delivery-v6 fc33c741497757c32a7283950ad62490cc7ae196
          app-delivery-v7 fc33c741497757c32a7283950ad62490cc7ae196
          app-delivery-v8 b05d743812587256c462f1ca8194d919595c5465
          app-delivery-v9 eeaa26b410af888e334c65e16208eb76f09195d3
          LISTA
